name: Diagnose tag release creation

# Temporary: replicates what tauri-action does on a tag push — create a release
# with GITHUB_TOKEN from a job holding `contents: write` — to find out why the
# build jobs fail with "Resource not accessible by integration".
on:
  push:
    tags: ["probe-*"]
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Try to create a release for the pushed tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          echo "event    : $GITHUB_EVENT_NAME"
          echo "ref      : $GITHUB_REF_NAME"
          echo "ref_type : ${GITHUB_REF_TYPE:-<unset>}"
          echo "--- probe 1: release for the pushed tag ---"
          if gh release create "$GITHUB_REF_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --title "probe $GITHUB_REF_NAME" \
              --notes "temporary probe" \
              --draft; then
            echo "PUSHED-TAG CREATE: SUCCEEDED"
          else
            echo "PUSHED-TAG CREATE: FAILED (exit $?)"
          fi
          echo "--- probe 2: release for a brand-new tag ---"
          NEW="probe-new-${{ github.run_id }}"
          if gh release create "$NEW" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$GITHUB_SHA" \
              --title "probe $NEW" \
              --notes "temporary probe" \
              --draft; then
            echo "NEW-TAG CREATE: SUCCEEDED"
            gh release delete "$NEW" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true
          else
            echo "NEW-TAG CREATE: FAILED (exit $?)"
          fi
