name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 0.1.0 (no v prefix). Creates the tag and a published GitHub release from the matching CHANGELOG section. No desktop artifacts are built — use a v* tag push for a full multi-platform build."
        required: true
        type: string

jobs:
  guard:
    name: Refuse duplicate published release
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    permissions:
      contents: read
    steps:
      - name: Check that no published release already exists for this tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          # If a release exists for this tag and is NOT a draft, abort. A
          # draft release with the same name is fine — tauri-action will
          # update it. A published release with the same tag means a prior
          # successful run already shipped this version; re-running would
          # either silently no-op or overwrite the published artifacts.
          STATE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo "missing")
          case "$STATE" in
            missing)
              echo "No existing release for $TAG — proceeding."
              ;;
            true)
              echo "Existing draft release for $TAG — tauri-action will update it. Proceeding."
              ;;
            false)
              echo "::error title=Duplicate release::A published release for $TAG already exists. Refusing to re-release the same version."
              echo "::error::To intentionally re-release, first delete the existing release: gh release delete $TAG --yes --cleanup-tag"
              exit 1
              ;;
            *)
              echo "::error::Unexpected gh release view output: $STATE"
              exit 1
              ;;
          esac

  notes:
    name: Extract release notes from CHANGELOG
    needs: guard
    if: always() && (needs.guard.result == 'success' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    outputs:
      body: ${{ steps.extract.outputs.body }}
      version: ${{ steps.extract.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: extract
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "Resolving CHANGELOG section for v$VERSION"
          BODY=$(awk -v ver="$VERSION" '
            $0 ~ "^## \\[" ver "\\]" { inside=1; print; next }
            inside && /^## \[/ { exit }
            inside { print }
          ' CHANGELOG.md 2>/dev/null || true)
          if [ -z "$BODY" ]; then
            echo "::error file=CHANGELOG.md::No CHANGELOG section found for version $VERSION. Add a '## [$VERSION] — YYYY-MM-DD' heading before tagging."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          {
            echo 'body<<RELEASE_NOTES_EOF'
            printf '%s\n' "$BODY"
            echo RELEASE_NOTES_EOF
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Release notes preview for v$VERSION"
            echo
            echo '```markdown'
            printf '%s\n' "$BODY"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Creates the draft release before any build runs, so every `tauri-action`
  # invocation takes its "found an existing release, upload the bundles" path
  # instead of its "create the release" path. That path has been failing with
  # `Resource not accessible by integration` for v0.4.18 onward, despite the
  # token holding `contents: write`, the action commit being unchanged since the
  # last working release, and a tag-push probe being able to create a release
  # with the same token. Creating it here with `gh` — which the probe proved
  # works — removes the dependency on whatever differs inside the action.
  #
  # `--target` is deliberately omitted: on a `push` event the tag already exists,
  # and `tauri-action` only needs a draft for this tag to attach to.
  prepare-release:
    name: Create the draft release
    needs: notes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create the draft if it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          NOTES: ${{ needs.notes.outputs.body }}
        run: |
          set -euo pipefail
          STATE=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' 2>/dev/null || echo "missing")
          if [ "$STATE" = "missing" ]; then
            printf '%s\n' "$NOTES" > /tmp/notes.md
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --title "$TAG" \
              --notes-file /tmp/notes.md \
              --draft
            echo "Created draft release $TAG"
          else
            echo "Release $TAG already exists (draft=$STATE); leaving it alone"
          fi

  build-macos:
    needs: [notes, prepare-release]
    if: github.event_name == 'push'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

  build-linux:
    needs: [notes, prepare-release]
    if: github.event_name == 'push'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

  build-windows:
    needs: [notes, prepare-release]
    if: github.event_name == 'push'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: ${{ github.ref_name }}
          releaseBody: ${{ needs.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

  docker-publish:
    name: Build and publish Docker image
    needs: notes
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/codex-trace
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/codex-trace:buildcache-amd64
          cache-to: type=registry,ref=${{ secrets.DOCKERHUB_USERNAME }}/codex-trace:buildcache-amd64,mode=max

  publish:
    name: Publish release (flip draft → public)
    needs: [build-macos, build-linux, build-windows, docker-publish]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${{ github.ref_name }}" \
            --repo "${{ github.repository }}" \
            --draft=false \
            --latest

  manual-release:
    name: Create release without artifacts (manual)
    needs: notes
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Create published release (tag + notes, no build artifacts)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.notes.outputs.version }}
          BODY: ${{ needs.notes.outputs.body }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          # Refuse to clobber an existing release/tag — the manual path is for
          # bootstrapping a version that hasn't shipped yet. To re-release,
          # delete the existing one first: gh release delete $TAG --yes --cleanup-tag
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error title=Duplicate release::A release for $TAG already exists. Refusing to overwrite."
            exit 1
          fi
          printf '%s\n' "$BODY" > "$RUNNER_TEMP/notes.md"
          # Creates the tag at this commit (the dispatched ref) and a published,
          # latest release with the CHANGELOG section as the body. No artifacts.
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            --latest
          echo "Created release $TAG at $GITHUB_SHA with no build artifacts."

  notify:
    name: Email release result
    needs:
      [
        guard,
        notes,
        prepare-release,
        build-macos,
        build-linux,
        build-windows,
        docker-publish,
        publish,
        manual-release,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send release result email
        uses: dawidd6/action-send-mail@v6
        with:
          server_address: ${{ vars.SMTP_HOST }}
          server_port: ${{ vars.SMTP_PORT }}
          secure: true
          username: ${{ secrets.SMTP_USERNAME }}
          password: ${{ secrets.SMTP_PASSWORD }}
          from: ${{ secrets.SMTP_FROM }}
          to: ${{ secrets.NOTIFY_EMAIL_TO }}
          subject: "[codex-trace] ${{ github.ref_name }} release workflow result"
          body: |
            Repository: ${{ github.repository }}
            Ref: ${{ github.ref_name }}
            Commit: ${{ github.sha }}
            Event: ${{ github.event_name }}

            Guard: ${{ needs.guard.result }}
            Release notes: ${{ needs.notes.result }}
            macOS: ${{ needs['build-macos'].result }}
            Linux: ${{ needs['build-linux'].result }}
            Windows: ${{ needs['build-windows'].result }}
            Docker: ${{ needs['docker-publish'].result }}
            Publish: ${{ needs.publish.result }}
            Manual release: ${{ needs['manual-release'].result }}
